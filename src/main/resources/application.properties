
spring.application.name=teamforge
server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/team_formation_db?createDatabaseIfNotExist=true&sslMode=REQUIRED}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

app.jwt.secret=${JWT_SECRET:change-this-to-a-long-random-secret-key-1234567890}
app.jwt.expiration-ms=86400000
